services:
  postgres:
    image: postgres:16-alpine
    container_name: perround-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: perround
      POSTGRES_PASSWORD: perround
      POSTGRES_DB: perround
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
